name: Build and Deploy

on:
  push:
    branches:
      - develop

jobs:

  # ========================================
  # 1. BUILD
  # ========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: chargingstation-jar
          path: target/*.jar


  # ========================================
  # 2. TEST
  # ========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run tests
        run: mvn test


  # ========================================
  # 3. DEPLOY
  # ========================================
  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: chargingstation-jar
          path: target

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/*.jar"
          target: "/opt/chargingstation/"
          strip_components: 1


  # ========================================
  # 4. RESTART
  # ========================================
  restart:
    name: Restart Application
    runs-on: ubuntu-latest

    needs: deploy

    steps:

      - name: Restart Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart chargingstation
            sudo systemctl status chargingstation --no-pager
